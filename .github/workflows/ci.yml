name: M3TAL Dashboard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-python-dashboard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Lint Tools
      run: pip install flake8
    - name: Lint — syntax errors and undefined names
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=vendor,venv,.venv,scratch
    - name: Lint — style warnings
      run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=vendor,venv,.venv,scratch
